  <!-- Google Fonts -->

  <!-- Vendor CSS Files -->
  <link href="{% static 'assets/vendor/aos/aos.css' %}" rel="stylesheet" />
  <link href="{% static 'assets/vendor/bootstrap/css/bootstrap.min.css' %}" rel="stylesheet" />

  <script type="text/javascript" src="{% static 'assets/js/jquery-3.7.0.min.js' %}"></script>
  <style>
    body{
        font-family: "Acumin Pro", sans-serif;
        background-color: #080808;
        background-repeat: no-repeat;
        height: 100vh;
        z-index: 999;
        display: flex;
        justify-content: center;
        align-items: center;
    }
    .invite404-btn {
      position: relative;
      max-width: 60%;
      z-index: 10;
      border-radius: 50%;
      background-color: transparent;
      color: #f2f2f2;
      padding: 16px 60px;
      text-align: center;
      vertical-align: middle;
      font-size: 18px;
      font-weight: 300;
      text-transform: uppercase;
      border-radius: 40px;
      transition: 0.6s ease;
      border: 1px solid #e3a325;
    } 
    /* 404 */
    .razer404-overlapping-header {
      line-height: 25px;
    }

    .razer404-overlapping-span1 {
      font-size: 300px;
      background: -webkit-linear-gradient(#eee, #eeeeee00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.1;
    }

    .razer404-overlapping-span2 {
      font-size: 300px;
      background: -webkit-linear-gradient(#eee, #eeeeee00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.1;
    }

    .razer404yes{
      font-size: 280px;
    }

    .razer404lost{
      font-size: 62px;
      font-weight: 300;
      color: #f2f2f2;
    }

    .razer404-takemehome{
      margin-top: 120px;
    }

    @media (max-width: 768px) {
      /* 404 */
    .razer404-overlapping-header {
      line-height: 25px;
    }

    .razer404-overlapping-span1 {
      font-size: 100px;
      background: -webkit-linear-gradient(#eee, #eeeeee00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.1;
    }

    .razer404-overlapping-span2 {
      font-size: 100px;
      background: -webkit-linear-gradient(#eee, #eeeeee00);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      opacity: 0.1;
    }

    .razer404yes{
      font-size: 120px;
    }

    .razer404lost{
      font-size: 30px;
      font-weight: 300;
      color: #f2f2f2;
    }
    }
    

  </style>
</head>
<body>
    <div class="container">
        <div class="section-title">
            <h2 class="razer404-overlapping-header"><span><span class="razer404-overlapping-span1">404</span><br><span><span class="span-razer razer404yes">YES!</span></span></span></h2>
          <h3 class="razer404lost" >YOU ARE LOST</h3>
          <div class="razer404-takemehome">
            <a href="{% url 'index' %}" class="invite404-btn">TAKE ME HOME</a>
          </div>
        </div>
    </div>
</body>
